name: CI – Wine Quality MLProject

on:
  push:
    branches: [ main ]
    paths:
      - 'MLProject/**'
  workflow_dispatch:

jobs:
  train-and-deploy:
    name: Train, Upload & Docker
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Check Env
        run: |
          python --version
          pip --version
          echo "DAGSHUB_USERNAME=${{ secrets.DAGSHUB_USERNAME }}"
          echo "DAGSHUB_REPO=${{ secrets.DAGSHUB_REPO }}"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas==2.2.2 numpy==1.26.4 scikit-learn==1.5.1 \
                      mlflow==2.19.0 matplotlib==3.9.1 seaborn==0.13.2

      - name: Run mlflow project
        env:
          DAGSHUB_USERNAME:          ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_REPO:              ${{ secrets.DAGSHUB_REPO }}
          MLFLOW_TRACKING_USERNAME:  ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD:  ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          cd MLProject
          mlflow run . --env-manager=local -e main

      - name: Get latest MLflow run_id
        run: |
          # run_id sudah ditulis modelling.py ke file mlflow_run_id.txt
          RUN_ID=$(cat MLProject/mlflow_run_id.txt)
          echo "Latest run_id: $RUN_ID"
          echo "MLFLOW_LATEST_RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: pip install requests

      - name: Upload to GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          mkdir -p model_artifacts
          cp -r MLProject/model_output/. model_artifacts/
          echo "${{ env.MLFLOW_LATEST_RUN_ID }}" > model_artifacts/run_id.txt
          git add model_artifacts/
          git diff --staged --quiet || \
            git commit -m "ci: update model artifacts – run ${{ github.run_number }} [skip ci]"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push

      - name: Build Docker Model
        run: |
          mlflow models build-docker \
            -m "MLProject/model_output" \
            -n "wine-quality-rf" \
            --enable-mlserver

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag wine-quality-rf:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/wine-quality-rf:latest
          docker tag wine-quality-rf:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/wine-quality-rf:${{ github.run_number }}

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/wine-quality-rf:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/wine-quality-rf:${{ github.run_number }}
          echo "Pushed: https://hub.docker.com/r/${{ secrets.DOCKERHUB_USERNAME }}/wine-quality-rf"